<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Deportivo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section id="pantalla_inicio" class="pantalla activa">
        <h1>Quiz Deportivo</h1>
        <p>Pon a prueba tus conocimientos de deportes con preguntas de distintas áreas.</p>
        <button id="boton_empezar">Iniciar Quiz</button>
        <button id="boton_editar">Editar Preguntas</button>
    </section>

    <section id="pantalla_quiz" class="pantalla">
        <p id="contador_pregunta">Pregunta 1 de 5</p>
        <p id="puntaje_actual">Puntaje: 0</p>

        <h2 id="texto_pregunta"></h2>

        <div id="contenedor_opciones"></div>

        <p id="texto_feedback"></p>

        <button id="boton_siguiente" class="oculto">Siguiente</button>
    </section>

    <section id="pantalla_resultados" class="pantalla">
        <h2>Resultados</h2>
        <p id="texto_puntaje_final"></p>
        <button id="boton_reiniciar">Reiniciar Quiz</button>
    </section>

    <section id="pantalla_editar" class="pantalla">
        <h2>Editar Preguntas</h2>
        <div id="contenedor_edicion"></div>
        <button id="boton_guardar_edicion">Guardar Cambios</button>
        <button id="boton_volver_inicio">Volver al Inicio</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
